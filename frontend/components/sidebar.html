        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path>

      </div>
      <span style="font-size:18px;font-weight:700;color:var(--text-1); font-family: 'Inter', sans-serif;">Game<span style="color:var(--accent);">Lab</span></span>

  <a class="nav-item active" id="nav-home" href="/index.html">

      <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z"/>

  </div>
</aside>

<script>
  (function() {
    // Determine active menu item
    const path = window.location.pathname;
    const items = document.querySelectorAll('.left-sidebar .nav-item');
    items.forEach(i => i.classList.remove('active'));

    if (path.includes('orders.html')) {
      const lib = document.getElementById('nav-library');
      if (lib) lib.classList.add('active');
    } else if (window.location.search.includes('deals=true')) {
      const deals = document.getElementById('nav-deals');
      if (deals) deals.classList.add('active');
    } else if (path.includes('index.html') || path === '/' || path === '') {
      const home = document.getElementById('nav-home');
      if (home) home.classList.add('active');
    }

    // Toggle library view for logged in users
    const token = localStorage.getItem("token");
    const libBtn = document.getElementById('nav-library');
    if (token && libBtn) {
      libBtn.style.display = 'flex';
    }
  })();
</script>
