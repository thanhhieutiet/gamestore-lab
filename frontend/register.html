<!DOCTYPE html>
<html lang="vi">
<head>
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');else document.documentElement.classList.remove('light');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameLab — Đăng ký</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="/assets/css/shoplab.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body style="font-family:'Inter',sans-serif; background:var(--surface-0); color:var(--text-1); -webkit-font-smoothing:antialiased;">
  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Page content wrapper -->
  <main style="max-width:1280px; margin:0 auto; padding:32px 24px; min-height:calc(100vh - 60px - 280px); display:flex; align-items:center; justify-content:center;">
    <div style="background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; display:flex; max-width:840px; width:100%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
      
      <!-- Left: dark branding panel (340px) -->
      <div style="width:340px; flex-shrink:0; background:linear-gradient(160deg,#1e1b4b 0%,#312e81 100%); padding:40px; display:flex; flex-direction:column; justify-content:space-between; color:white;">
        <div>
          <a href="index.html" class="logo flex items-center gap-2" style="text-decoration:none;">
            <div style="width:28px;height:28px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;">
              <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <span style="font-size:18px;font-weight:700;color:#ffffff;">Game<span style="color:var(--accent);">Lab</span></span>
          </a>
        </div>
        
        <div style="margin:40px 0;">
          <h2 style="font-size:24px; font-weight:800; color:white; line-height:1.2; margin-bottom:12px;">Cyber Range Lab Security Training</h2>
          <p style="font-size:13px; color:rgba(255,255,255,0.7); line-height:1.6;">
            Trải nghiệm môi trường giả lập cửa hàng game trực quan để phân tích, học tập các lỗ hổng bảo mật Web phổ biến.
          </p>
        </div>
        
        <div style="font-size:11px; color:rgba(255,255,255,0.5);">
          Authorized use only. Educational purpose.
        </div>
      </div>

      <!-- Right: form (flex:1) -->
      <div style="flex:1; padding:40px;">
        <h2 style="font-size:22px; font-weight:700; color:var(--text-1); margin-bottom:6px;">Đăng ký</h2>
        <p style="font-size:13px; color:var(--text-3); margin-bottom:24px;">Tạo tài khoản mới của bạn bên dưới</p>

        <form id="register-form" onsubmit="event.preventDefault(); register();">
          <!-- Error Alert Box -->
          <div id="error-alert" class="hidden p-3 mb-4 text-sm rounded-lg" style="background: var(--danger-lt); color: var(--danger); border: 1px solid var(--danger);" role="alert">
            <span class="font-semibold">Lỗi đăng ký:</span> <span id="error-message"></span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- displayName field -->
            <div style="margin-bottom:12px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px;">Họ và tên</label>
              <input
                type="text"
                id="displayName"
                placeholder="e.g. Nguyễn Văn A"
                style="width:100%; height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--surface-0); color:var(--text-1); outline:none; box-sizing:border-box; transition:border-color .15s,box-shadow .15s;"
                onfocus="this.style.borderColor='var(--brand)';this.style.boxShadow='0 0 0 3px rgba(79,70,229,.12)'"
                onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'"
                required
              />
            </div>

            <!-- username field -->
            <div style="margin-bottom:12px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px;">Tên đăng nhập</label>
              <input
                type="text"
                id="username"
                placeholder="e.g. nguyenvana"
                style="width:100%; height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--surface-0); color:var(--text-1); outline:none; box-sizing:border-box; transition:border-color .15s,box-shadow .15s;"
                onfocus="this.style.borderColor='var(--brand)';this.style.boxShadow='0 0 0 3px rgba(79,70,229,.12)'"
                onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'"
                required
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- email field -->
            <div style="margin-bottom:12px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px;">Email</label>
              <input
                type="email"
                id="email"
                placeholder="e.g. ana@domain.com"
                style="width:100%; height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--surface-0); color:var(--text-1); outline:none; box-sizing:border-box; transition:border-color .15s,box-shadow .15s;"
                onfocus="this.style.borderColor='var(--brand)';this.style.boxShadow='0 0 0 3px rgba(79,70,229,.12)'"
                onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'"
                required
              />
            </div>

            <!-- phone field -->
            <div style="margin-bottom:12px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px;">Số điện thoại</label>
              <input
                type="text"
                id="phone"
                placeholder="e.g. 0912345678"
                style="width:100%; height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--surface-0); color:var(--text-1); outline:none; box-sizing:border-box; transition:border-color .15s,box-shadow .15s;"
                onfocus="this.style.borderColor='var(--brand)';this.style.boxShadow='0 0 0 3px rgba(79,70,229,.12)'"
                onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'"
                required
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- password field -->
            <div style="margin-bottom:12px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px;">Mật khẩu</label>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                style="width:100%; height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--surface-0); color:var(--text-1); outline:none; box-sizing:border-box; transition:border-color .15s,box-shadow .15s;"
                onfocus="this.style.borderColor='var(--brand)';this.style.boxShadow='0 0 0 3px rgba(79,70,229,.12)'"
                onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'"
                required
              />
            </div>

            <!-- confirmPassword field -->
            <div style="margin-bottom:16px;">
              <label style="display:block; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:6px;">Xác nhận mật khẩu</label>
              <input
                type="password"
                id="confirmPassword"
                placeholder="••••••••"
                style="width:100%; height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--surface-0); color:var(--text-1); outline:none; box-sizing:border-box; transition:border-color .15s,box-shadow .15s;"
                onfocus="this.style.borderColor='var(--brand)';this.style.boxShadow='0 0 0 3px rgba(79,70,229,.12)'"
                onblur="this.style.borderColor='var(--border)';this.style.boxShadow='none'"
                required
              />
            </div>
          </div>


          <!-- Consent Checkbox -->
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
            <input
              type="checkbox"
              id="consent"
              style="accent-color:var(--brand); width:15px; height:15px; cursor:pointer;"
              required
            />
            <label for="consent" style="font-size:13px; color:var(--text-2); cursor:pointer;">
              Tôi đồng ý với <a href="#" style="color:var(--brand); text-decoration:none;">Điều khoản sử dụng</a>
            </label>
          </div>

          <!-- Register button -->
          <button
            type="submit"
            style="width:100%; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:14px; font-weight:600; border-radius:var(--radius-sm); cursor:pointer; padding:0 16px; height:40px; border:none; background:var(--brand); color:white; font-family:inherit; transition:background .15s; margin-bottom:16px;"
            onmouseover="this.style.background='var(--brand-dark)'"
            onmouseout="this.style.background='var(--brand)'"
          >
            Đăng ký tài khoản
          </button>
        </form>

        <!-- Redirect to Login -->
        <div style="text-align:center; font-size:13px; color:var(--text-3); margin-top:10px;">
          Đã có tài khoản?
          <a href="/login.html" style="color:var(--brand); font-weight:600; text-decoration:none;">Đăng nhập ngay</a>
        </div>
      </div>
      
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script>
    const API = "/api";

    document.addEventListener("DOMContentLoaded", async () => {
      await includeComponent("#navbar-placeholder", "/components/navbar.html");
      await includeComponent("#footer-placeholder", "/components/footer.html");
    });

    async function register() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const errorAlert = document.getElementById("error-alert");
      const errorMessage = document.getElementById("error-message");

      errorAlert.classList.add("hidden");

      if (password !== confirmPassword) {
        errorMessage.textContent = "Mật khẩu xác nhận không khớp.";
        errorAlert.classList.remove("hidden");
        if (typeof showToast === 'function') {
          showToast("Mật khẩu không khớp", "Hãy kiểm tra lại trường xác nhận mật khẩu.", "error");
        }
        return;
      }

      const payload = {
        username: document.getElementById("username").value,
        password: password,
        email: document.getElementById("email").value,
        displayName: document.getElementById("displayName").value,
        phone: document.getElementById("phone").value
      };

      // Get referral code if exists
      const ref = new URLSearchParams(window.location.search).get("ref");
      if (ref) {
        payload.referral = ref;
      }

      try {
        // Send POST to /api/auth/register with the entire payload (Vulnerable to Mass Assignment)
        const res = await fetch(`${API}/auth/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || data.error || "Đăng ký không thành công");
        }

        if (typeof showToast === 'function') {
          showToast("Đăng ký thành công!", "Đang chuyển hướng sang trang đăng nhập...", "success");
        }

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1500);

      } catch (err) {
        console.error(err);
        errorMessage.textContent = err.message;
        errorAlert.classList.remove("hidden");
        if (typeof showToast === 'function') {
          showToast("Đăng ký thất bại", err.message, "error");
        }
      }
    }
  </script>
</body>
</html>
