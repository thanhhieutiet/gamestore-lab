<!DOCTYPE html>
<html lang="vi">
<head>
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');else document.documentElement.classList.remove('light');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameLab — Khuyến mãi (Deals)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="/assets/css/shoplab.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body style="font-family:'Inter',sans-serif; background:var(--surface-0); color:var(--text-1); -webkit-font-smoothing:antialiased;">
  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Hero Header for Deals -->
  <div style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(99, 102, 241, 0.05) 100%); border-bottom: 1px solid var(--border); padding: 48px 24px; text-align: center;">
    <span style="background: rgba(239, 68, 68, 0.2); color: #ef4444; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 9999px; margin-bottom: 12px; display: inline-block;">
      GameLab Special Deals
    </span>
    <h1 style="font-size: 32px; font-weight: 800; color: var(--text-1); margin-bottom: 8px;">Khuyến mãi đặc biệt</h1>
    <p style="font-size: 14px; color: var(--text-3); max-width: 600px; margin: 0 auto;">
      Tiết kiệm lên tới 50% cho các tựa game và sản phẩm công nghệ hot nhất trong tuần này.
    </p>
  </div>

  <!-- Main Container -->
  <main style="max-width:1280px; margin:0 auto; padding:32px 24px; min-height:calc(100vh - 60px - 280px - 180px);">
    <!-- Grid of Deals -->
    <div id="deals-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Loading indicator -->
      <div class="col-span-full flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
      </div>
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script>
    const API = "http://localhost:3000/api";
    const BASE_URL = "http://localhost:3000";

    // Hardcode discount percentages for realistic visual effects
    const discountRates = {
      1: 10,  // MacBook Pro
      2: 15,  // Dell XPS
      3: 20,  // Asus ROG
      4: 10,  // iPhone 16
      5: 25,  // Samsung S24
      6: 15,  // iPad Pro
      7: 30,  // Apple Watch
      8: 40,  // Flipper Zero
      9: 50,  // YubiKey
      10: 50  // IoT Lock
    };

    let ownedProductIds = [];

    document.addEventListener("DOMContentLoaded", async () => {
      await includeComponent("#navbar-placeholder", "/components/navbar.html");
      await includeComponent("#footer-placeholder", "/components/footer.html");

      // Fetch owned game IDs
      const token = localStorage.getItem("token");
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          const resOrders = await fetch(`${API}/orders`);
          if (resOrders.ok) {
            const orders = await resOrders.json();
            const userOrders = orders.filter(o => o.user_id === payload.id && o.status === 'completed');
            userOrders.forEach(o => {
              if (o.items) {
                o.items.forEach(item => {
                  const idInt = parseInt(item.id);
                  if (!ownedProductIds.includes(idInt)) {
                    ownedProductIds.push(idInt);
                  }
                });
              }
            });
          }
        } catch (e) {
          console.error("Error loading owned games:", e);
        }
      }

      loadDeals();
    });

    async function loadDeals() {
      const grid = document.getElementById("deals-grid");
      try {
        const res = await fetch(`${API}/products/search`);
        if (!res.ok) throw new Error("Không thể tải danh sách khuyến mãi");
        const products = await res.json();

        // Map and sort by discount rate descending
        const itemsWithDeals = products.map(p => {
          const discount = discountRates[p.id] || 15; // default 15% if new product
          const originalPrice = p.price / (1 - discount / 100);
          return {
            ...p,
            discount: discount,
            originalPrice: originalPrice
          };
        }).sort((a, b) => b.discount - a.discount);

        grid.innerHTML = "";
        itemsWithDeals.forEach(item => {
          grid.appendChild(createDealCard(item));
        });

      } catch (err) {
        console.error(err);
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-red-500 font-semibold">
            Lỗi tải dữ liệu khuyến mãi: ${err.message}
          </div>
        `;
      }
    }

    function createDealCard(item) {
      const imgPath = item.image_path
        ? item.image_path.startsWith("http") ? item.image_path : BASE_URL + item.image_path
        : "https://picsum.photos/seed/" + item.id + "/400/300";

      const formattedPrice = parseFloat(item.price).toLocaleString("en-US", { minimumFractionDigits: 2 });
      const formattedOriginal = parseFloat(item.originalPrice).toLocaleString("en-US", { minimumFractionDigits: 2 });

        let cartBtnHTML = '';
        const isOwned = ownedProductIds.includes(parseInt(item.id));
        if (isOwned) {
          cartBtnHTML = `
            <a href="library.html" 
              class="btn-add-cart flex items-center justify-center" 
              title="Đã sở hữu (Vào thư viện)"
              style="margin-left:auto; width:32px; height:32px; border-radius:8px; background: rgba(34, 197, 94, 0.15); color: #22c55e; border: none; display: flex; align-items: center; justify-content: center; text-decoration:none;"
            >
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            </a>
          `;
        } else {
          cartBtnHTML = `
            <button 
              class="btn-add-cart" 
              data-id="${item.id}" 
              data-name="${item.name}" 
              data-price="${item.price}" 
              data-image="${imgPath}"
              onclick="handleAddToCartClick(this)"
              title="Thêm vào giỏ"
              style="margin-left:auto; width:32px; height:32px; border-radius:8px; background:var(--brand-lt); color:var(--brand); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s;"
              onmouseover="this.style.background='var(--brand)'; this.style.color='#fff';"
              onmouseout="this.style.background='var(--brand-lt)'; this.style.color='var(--brand)';"
            >
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
            </button>
          `;
        }

        const div = document.createElement("div");
        div.className = "product-card";
        div.style.cssText = "display:flex; flex-direction:column; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; position:relative;";
        
        div.innerHTML = `
          <div style="aspect-ratio:16/10; overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--surface-0); position:relative;">
            <img src="${imgPath}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover; transition:transform .3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'" />
            
            <!-- Discount badge -->
            <span style="position:absolute; top:12px; left:12px; background:#ef4444; color:white; font-size:11px; font-weight:800; padding:3px 8px; border-radius:4px; letter-spacing:0.02em; z-index:10; box-shadow: 0 4px 6px rgba(0,0,0,0.15);">
              -${item.discount}%
            </span>
          </div>
          
          <div style="padding:16px; flex:1; display:flex; flex-direction:column;">
            <div style="font-size:10px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;">
              ${item.category || "Game"}
            </div>
            <a href="product.html?id=${item.id}" style="text-decoration:none;">
              <h4 style="font-size:14px; font-weight:700; color:var(--text-1); line-height:1.4; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
                ${item.name}
              </h4>
            </a>
            
            <div style="display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:12px; border-top:1px solid var(--border);">
              <div style="display:flex; flex-direction:column;">
                <span style="font-size:11px; color:var(--text-4); text-decoration:line-through;">$${formattedOriginal}</span>
                <span style="font-size:15px; font-weight:800; color:#ef4444;">$${formattedPrice}</span>
              </div>
              ${cartBtnHTML}
            </div>
          </div>
        `;
      return div;
    }

    function handleAddToCartClick(btn) {
      const id = btn.getAttribute("data-id");
      const name = btn.getAttribute("data-name");
      const price = btn.getAttribute("data-price");
      const image = btn.getAttribute("data-image");
      addToCart(id, name, price, image);
    }
  </script>
</body>
</html>
