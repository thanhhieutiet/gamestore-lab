<!DOCTYPE html>
<html lang="vi">
<head>
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');else document.documentElement.classList.remove('light');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameLab — Giỏ hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="/assets/css/shoplab.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body style="font-family:'Inter',sans-serif; background:var(--surface-0); color:var(--text-1); -webkit-font-smoothing:antialiased;">
  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Main Container -->
  <main style="max-width:1280px; margin:0 auto; padding:32px 24px; min-height:calc(100vh - 60px - 280px);">
    <h1 style="font-size:24px; font-weight:800; color:var(--text-1); margin-bottom:24px;">Giỏ hàng của bạn</h1>

    <div class="flex flex-col lg:flex-row gap-8 items-start">
      
      <!-- Left: Cart Items Table (2/3) -->
      <div style="flex: 2; width:100%;">
        <table class="data-table" style="width:100%; border-collapse:collapse;">
          <thead style="border-bottom:2px solid var(--border);">
            <tr>
              <th style="padding:16px 8px; width:50px; text-align:center; vertical-align:middle;">
                <input type="checkbox" id="select-all-cart" checked onclick="toggleSelectAllCart()" style="cursor:pointer; margin-right:0;" />
              </th>
              <th style="padding:16px 8px; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); font-weight:700;">Game</th>
              <th style="padding:16px 8px; text-align:right; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); font-weight:700;">Đơn giá</th>
              <th style="padding:16px 8px; text-align:center; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-3); font-weight:700;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="cart-items-tbody">
            <!-- Dynamic items load here -->
            <tr>
              <td colspan="4" style="text-align:center; padding:32px; color:var(--text-3);">
                Đang tải giỏ hàng...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
 
      <!-- Right: Summary Card (1/3) -->
      <div style="flex: 1; width:100%; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; position: sticky; top: 84px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);">
        <h2 style="font-size:18px; font-weight:700; color:var(--text-1); margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">Tóm tắt đơn hàng</h2>
        
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px; color:var(--text-2);">
          <span>Tạm tính</span>
          <span id="summary-subtotal">$0.00</span>
        </div>
 
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-size:14px; color:var(--text-2);">
          <span>Phí giao dịch số (Digital fee)</span>
          <span style="color:var(--success); font-weight:600;">Miễn phí</span>
        </div>
 
        <div style="display:flex; justify-content:space-between; margin-bottom:24px; font-size:16px; font-weight:700; color:var(--text-1); border-top:1px dashed var(--border); padding-top:16px;">
          <span>Tổng cộng</span>
          <span id="summary-total">$0.00</span>
        </div>
 
        <button onclick="proceedToCheckout()" id="btn-checkout" style="width:100%; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; border-radius:var(--radius-sm); cursor:pointer; padding:0 16px; height:42px; border:none; background:var(--brand); color:white; font-family:inherit; transition:all 0.15s; margin-bottom: 20px;" onmouseover="this.style.background='var(--brand-dark)'; this.style.transform='translateY(-1px)';" onmouseout="this.style.background='var(--brand)'; this.style.transform='none';">
          Tiến hành thanh toán
        </button>

        <!-- Trust Badges & Secure Info -->
        <div style="border-top: 1px solid var(--border); padding-top: 16px; display:flex; flex-direction:column; gap:12px;">
          <!-- Secure Checkout Indicator -->
          <div style="display:flex; align-items:center; gap:8px; color:var(--text-3); font-size:12px;">
            <svg class="w-4 h-4 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            <span>Thanh toán 100% bảo mật SSL</span>
          </div>

          <!-- Refund / Activation Guarantee -->
          <div style="display:flex; align-items:center; gap:8px; color:var(--text-3); font-size:12px;">
            <svg class="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span>Kích hoạt game ngay lập tức</span>
          </div>

          <!-- Payment Logos Mockup -->
          <div style="display:flex; gap:6px; align-items:center; justify-content:center; margin-top:4px; opacity:0.65; flex-wrap:wrap;">
            <span style="font-size:9px; font-weight:800; background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:2px 6px; border-radius:4px; color:var(--text-3); font-family:sans-serif; letter-spacing:0.05em;">MOMO</span>
            <span style="font-size:9px; font-weight:800; background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:2px 6px; border-radius:4px; color:var(--text-3); font-family:sans-serif; letter-spacing:0.05em;">ZALOPAY</span>
            <span style="font-size:9px; font-weight:800; background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:2px 6px; border-radius:4px; color:var(--text-3); font-family:sans-serif; letter-spacing:0.05em;">CARD</span>
            <span style="font-size:9px; font-weight:800; background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:2px 6px; border-radius:4px; color:var(--text-3); font-family:sans-serif; letter-spacing:0.05em;">WALLET</span>
          </div>
        </div>
      </div>
 
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await includeComponent("#navbar-placeholder", "/components/navbar.html");
      await includeComponent("#footer-placeholder", "/components/footer.html");
      renderCart();
    });

    function renderCart() {
      const tbody = document.getElementById("cart-items-tbody");
      const cart = getCart();

      if (cart.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align:center; padding:48px; color:var(--text-3);">
              Giỏ hàng của bạn đang trống. <a href="index.html" style="color:var(--brand); font-weight:600; text-decoration:none;">Mua game ngay</a>
            </td>
          </tr>
        `;
        document.getElementById("summary-subtotal").textContent = "$0.00";
        document.getElementById("summary-total").textContent = "$0.00";
        document.getElementById("btn-checkout").style.pointerEvents = "none";
        document.getElementById("btn-checkout").style.opacity = "0.5";
        return;
      }

      document.getElementById("btn-checkout").style.pointerEvents = "auto";
      document.getElementById("btn-checkout").style.opacity = "1";

      tbody.innerHTML = "";
      cart.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.style.cssText = "border-bottom:1px solid var(--border);";
        
        tr.innerHTML = `
          <td style="padding:16px 8px; text-align:center; vertical-align:middle;">
            <input type="checkbox" class="cart-item-checkbox" data-id="${item.id}" ${item.selected !== false ? 'checked' : ''} onclick="toggleItemSelect(${index})" style="cursor:pointer; margin-right:0;" />
          </td>
          <td style="padding:16px 8px; display:flex; align-items:center; gap:12px;">
            <div style="width:50px; height:60px; background:var(--surface-0); border-radius:var(--radius-sm); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <img src="${item.image || 'https://picsum.photos/seed/' + item.id + '/100/100'}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover;" />
            </div>
            <div style="font-weight:600; color:var(--text-1); font-size:14px; max-width:280px; word-break:break-word; text-align:left;">
              ${item.name}
            </div>
          </td>
          <td style="padding:16px 8px; text-align:right; font-weight:600; color:var(--text-1); font-size:14px; vertical-align:middle;">
            $${parseFloat(item.price).toLocaleString('en-US', { minimumFractionDigits: 2 })}
          </td>
          <td style="padding:16px 8px; text-align:center; vertical-align:middle;">
            <button onclick="removeItem(${index})" style="background:transparent; border:none; cursor:pointer; color:var(--danger); font-weight:600; font-size:13px; hover:underline;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
              Xóa
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update Summary totals
      let subtotal = 0;
      cart.forEach(item => {
        if (item.selected !== false) {
          subtotal += item.price;
        }
      });
      const total = subtotal;

      document.getElementById("summary-subtotal").textContent = `$${subtotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      document.getElementById("summary-total").textContent = `$${total.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

      // Update select-all checkbox state
      const selectAllCheckbox = document.getElementById("select-all-cart");
      if (selectAllCheckbox) {
        selectAllCheckbox.checked = cart.every(item => item.selected !== false);
      }
    }

    function toggleItemSelect(index) {
      let cart = getCart();
      if (index < 0 || index >= cart.length) return;
      
      cart[index].selected = cart[index].selected === false ? true : false;
      sessionStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function toggleSelectAllCart() {
      const selectAll = document.getElementById("select-all-cart").checked;
      let cart = getCart();
      cart.forEach(item => {
        item.selected = selectAll;
      });
      sessionStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function proceedToCheckout() {
      const cart = getCart();
      const selected = cart.filter(item => item.selected !== false);
      if (selected.length === 0) {
        showToast("Giỏ hàng trống", "Vui lòng chọn ít nhất một game để tiến hành thanh toán.", "warning");
        return;
      }
      sessionStorage.setItem('checkout_items', JSON.stringify(selected));
      window.location.href = "checkout.html";
    }

    function removeItem(index) {
      let cart = getCart();
      if (index < 0 || index >= cart.length) return;
      
      const removedItem = cart[index];
      cart.splice(index, 1);
      
      sessionStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      renderCart();
      
      showToast("Đã xóa khỏi giỏ hàng", removedItem.name, "warning");
    }
  </script>
</body>
</html>
