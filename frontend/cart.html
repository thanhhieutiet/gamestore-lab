<!DOCTYPE html>
<html lang="vi">
<head>
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');else document.documentElement.classList.remove('light');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameLab — Giỏ hàng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="/assets/css/shoplab.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body style="font-family:'Inter',sans-serif; background:var(--surface-0); color:var(--text-1); -webkit-font-smoothing:antialiased;">
  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Main Container -->
  <main style="max-width:1280px; margin:0 auto; padding:32px 24px; min-height:calc(100vh - 60px - 280px);">
    <h1 style="font-size:24px; font-weight:800; color:var(--text-1); margin-bottom:24px;">Giỏ hàng của bạn</h1>

    <div style="display:flex; gap:32px; flex-direction:column; lg:flex-direction:row; align-items:flex-start;">
      
      <!-- Left: Cart Items Table (2/3) -->
      <div style="flex: 2; width:100%; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;">
        <table class="data-table" style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
              <th style="padding:16px;">Game</th>
              <th style="padding:16px; text-align:center;">Đơn giá</th>
              <th style="padding:16px; text-align:center;">Số lượng</th>
              <th style="padding:16px; text-align:right;">Thành tiền</th>
              <th style="padding:16px; text-align:center;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="cart-items-tbody">
            <!-- Dynamic items load here -->
            <tr>
              <td colspan="5" style="text-align:center; padding:32px; color:var(--text-3);">
                Đang tải giỏ hàng...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Right: Summary Card (1/3) -->
      <div style="flex: 1; width:100%; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px;">
        <h2 style="font-size:18px; font-weight:700; color:var(--text-1); margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">Tóm tắt đơn hàng</h2>
        
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:14px; color:var(--text-2);">
          <span>Tạm tính</span>
          <span id="summary-subtotal">$0.00</span>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:16px; font-size:14px; color:var(--text-2);">
          <span>Phí giao dịch key game</span>
          <span>$30.00 <span style="font-size:12px; color:var(--text-3);">(30k)</span></span>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:24px; font-size:16px; font-weight:700; color:var(--text-1); border-top:1px dashed var(--border); padding-top:16px;">
          <span>Tổng cộng</span>
          <span id="summary-total">$0.00</span>
        </div>

        <a href="checkout.html" id="btn-checkout" style="width:100%; display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; border-radius:var(--radius-sm); cursor:pointer; padding:0 16px; height:40px; border:none; background:var(--brand); color:white; font-family:inherit; text-decoration:none; transition:background .15s;" onmouseover="this.style.background='var(--brand-dark)'" onmouseout="this.style.background='var(--brand)'">
          Tiến hành thanh toán
        </a>
      </div>

    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await includeComponent("#navbar-placeholder", "/components/navbar.html");
      await includeComponent("#footer-placeholder", "/components/footer.html");
      renderCart();
    });

    function renderCart() {
      const tbody = document.getElementById("cart-items-tbody");
      const cart = getCart();

      if (cart.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center; padding:48px; color:var(--text-3);">
              Giỏ hàng của bạn đang trống. <a href="index.html" style="color:var(--brand); font-weight:600; text-decoration:none;">Mua game ngay</a>
            </td>
          </tr>
        `;
        document.getElementById("summary-subtotal").textContent = "$0.00";
        document.getElementById("summary-total").textContent = "$0.00";
        document.getElementById("btn-checkout").style.pointerEvents = "none";
        document.getElementById("btn-checkout").style.opacity = "0.5";
        return;
      }

      document.getElementById("btn-checkout").style.pointerEvents = "auto";
      document.getElementById("btn-checkout").style.opacity = "1";

      tbody.innerHTML = "";
      cart.forEach((item, index) => {
        const itemSubtotal = item.price * item.quantity;
        const tr = document.createElement("tr");
        
        tr.innerHTML = `
          <td style="padding:16px; display:flex; align-items:center; gap:12px;">
            <div style="width:60px; height:60px; background:var(--surface-0); border-radius:var(--radius-sm); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <img src="${item.image || 'https://picsum.photos/seed/' + item.id + '/100/100'}" alt="${item.name}" style="width:100%; height:100%; object-fit:cover;" />
            </div>
            <div style="font-weight:600; color:var(--text-1); font-size:14px; max-width:260px; word-break:break-word;">
              ${item.name}
            </div>
          </td>
          <td style="padding:16px; text-align:center; font-size:14px; color:var(--text-2);">
            $${parseFloat(item.price).toLocaleString('en-US')}
          </td>
          <td style="padding:16px; text-align:center;">
            <div style="display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; background:var(--surface-1); height:30px;">
              <button onclick="updateQty(${index}, -1)" style="width:28px; height:100%; border:none; background:transparent; font-weight:bold; cursor:pointer; color:var(--text-2); outline:none;">-</button>
              <input type="text" value="${item.quantity}" readonly style="width:36px; height:100%; border:none; text-align:center; font-size:13px; font-weight:600; color:var(--text-1); background:transparent; outline:none;" />
              <button onclick="updateQty(${index}, 1)" style="width:28px; height:100%; border:none; background:transparent; font-weight:bold; cursor:pointer; color:var(--text-2); outline:none;">+</button>
            </div>
          </td>
          <td style="padding:16px; text-align:right; font-weight:600; color:var(--text-1); font-size:14px;">
            $${itemSubtotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}
          </td>
          <td style="padding:16px; text-align:center;">
            <button onclick="removeItem(${index})" style="background:transparent; border:none; cursor:pointer; color:var(--danger); font-weight:600; font-size:13px; hover:underline;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
              Xóa
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update Summary totals (Client-side calculations)
      const subtotal = getCartTotal();
      const shipping = 30.00; // 30k
      const total = subtotal + shipping;

      document.getElementById("summary-subtotal").textContent = `$${subtotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      document.getElementById("summary-total").textContent = `$${total.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
    }

    function updateQty(index, amount) {
      let cart = getCart();
      if (index < 0 || index >= cart.length) return;
      
      cart[index].quantity += amount;
      if (cart[index].quantity < 1) {
        cart[index].quantity = 1;
      }
      
      sessionStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      renderCart();
    }

    function removeItem(index) {
      let cart = getCart();
      if (index < 0 || index >= cart.length) return;
      
      const removedItem = cart[index];
      cart.splice(index, 1);
      
      sessionStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      renderCart();
      
      showToast("Đã xóa khỏi giỏ hàng", removedItem.name, "warning");
    }
  </script>
</body>
</html>
